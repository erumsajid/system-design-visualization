<style>
:root{--bg:#0f1319;--panel:#161c25;--panel2:#1c2430;--border:#2a3340;--text:#e6eaf0;--dim:#8892a0;--accent:#e3a008;--easy:#5a9b76;--medium:#c99a3e;--hard:#c06a5c}

points:["Write service generates a unique short code (or accepts a custom alias) and persists the original URL plus creation/expiry metadata.","Read service checks Redis first; on a miss it looks up the database and responds with an HTTP 302 redirect.","Keep the redirect path lightweight. Add expiration, abuse protection, and asynchronous click analytics as needed."]},
{name:"Dropbox",difficulty:"Easy",nodes:[
["uploader","Uploader","client",0,0],["downloader","Downloader","client",0,2],["gw","API Gateway + Load Balancer","gateway",1,1],["filesvc","File Service","service",2,1],["s3","S3 Object Storage","db",4,0],["meta","File Metadata DB","db",4,2],["cdn","CDN","external",0,4],["share","Shared Files","db",5,2]],
edges:[["uploader","gw","upload intent"],["downloader","gw","download request"],["gw","filesvc","route / auth"],["filesvc","s3","presigned URL"],["uploader","s3","upload chunks directly"],["s3","meta","upload-complete event"],["meta","cdn","cache hot files"],["cdn","downloader","download segments"],["meta","share","userId + fileId"]],
points:["Chunk files on the client and upload directly to object storage using short-lived pre-signed URLs; this keeps large file bytes off application servers.","Store file metadata separately: file ID, name, size, MIME type, uploader, status, object URL, and chunk manifest. Use an upload-complete event to finalize metadata.","Use a CDN for frequently accessed downloads. Add chunk checksums, deduplication, resumable uploads, permissions, and version history."]},
{name:"Local Delivery Service",difficulty:"Easy",nodes:[

edges:[["customer","gw","place order"],["driver","gw","driver updates"],["gw","order","routing"],["order","orderdb","persist order"],["gw","availability","check stock"],["availability","inventory","(item, DC)"],["inventory","availability","item : qty"],["availability","nearby","eligible stores"],["nearby","travel","estimate ETA"],["travel","nearby","travel time"]],
points:["Availability service checks item quantity by distribution center and returns nearby locations that can fulfill the basket.","Keep inventory reads close to the user with regional read replicas and sharding by region/distribution-center ID; protect stock updates with atomic conditional writes.","Nearby service combines distance with travel-time estimates, store coverage, and inventory availability instead of ranking by straight-line distance alone."]},
{name:"Ticketmaster",difficulty:"Medium",nodes:[
["client","Client","client",0,1],["cdn","CDN","external",1,1],["gw","API Gateway","gateway",2,1],["search","Search Service","service",3,0],["elastic","Elasticsearch","cache",4,0],["event","Event Service","service",3,1],["db","PostgreSQL Database","db",4,2],["queue","Virtual Waiting Queue","queue",2,3],["booking","Booking Service","service",3,3],["lock","Ticket Lock (Redis)","cache",4,3],["stripe","Stripe","external",3,4],["eventcache","Event Cache (Redis)","cache",3,2]],

["client","Client / IDE","client",0,1],["api","API Gateway","gateway",1,1],["primary","Primary Server","service",2,1],["redis","Leaderboard Sorted Set (Redis)","cache",3,0],["db","Primary DB (DynamoDB)","db",4,1],["sqs","AWS SQS","queue",3,3],["worker","Worker","service",4,3],["runtime","Isolated Runtime Services","external",5,3]],
edges:[["client","api","submit / fetch"],["api","primary","route request"],["primary","redis","leaderboard"],["primary","db","problems + submissions"],["primary","sqs","enqueue execution"],["sqs","worker","dispatch job"],["worker","runtime","run in sandbox"],["worker","primary","write result"],["primary","client","poll / WS result"]],
points:["Persist each submission, enqueue it, and return quickly; workers execute asynchronously and publish results for the client to poll or receive over a WebSocket.","Run untrusted code in isolated containers with CPU, memory, time, filesystem, and network restrictions. Use separate language runtimes and test harnesses.","Autoscale workers using queue depth. Persist test outcomes and runtime/error metadata; use idempotent job IDs to make retries safe."]},
{name:"WhatsApp",difficulty:"Medium",nodes:[
["a","Client A","client",0,1],["b","Client B","client",0,3],["lb","L4 Load Balancer","gateway",1,2],["chat","Chat Server Fleet","service",2,2],["db","Database (DynamoDB)","db",4,1],["redis","Redis Pub/Sub","queue",3,3],["clients","Connected Clients Registry","cache",4,3]],
edges:[["a","lb","WebSocket"],["b","lb","WebSocket"],["lb","chat","persistent connection"],["chat","db","persist messages"],["chat","redis","publish / subscribe"],["redis","chat","route to recipient server"],["chat","clients","clientId → userId"],["clients","chat","connection lookup"]],
points:["Keep persistent WebSocket connections on a fleet of chat servers behind an L4 load balancer; a connection registry maps users to the server holding their socket.","Persist messages durably before acknowledging delivery. Use pub/sub to route messages across server instances; offline messages are delivered on reconnect.","Maintain heartbeat ping/pong and sequence counters for liveness and sync. Use idempotent message IDs, delivery acknowledgements, and end-to-end encryption."]},
{name:"Rate Limiter",difficulty:"Medium",nodes:[
["client","Client","client",0,1],["gw","API Gateways","gateway",2,1],["redis","Sharded Redis Buckets","cache",2,0],["server","Application Server","service",4,1],["zk","ZooKeeper / Config Coordinator","external",2,3]],
edges:[["client","gw","request"],["gw","redis","get / update bucket"],["redis","gw","counter / token state"],["gw","server","success"],["gw","client","reject: HTTP 429"],["gw","zk","watch rule changes"],["zk","gw","maintain rules"]],
points:["Choose token bucket or sliding-window counters based on whether bursts are allowed and how accurately the limit must be enforced.","Shard Redis counters by a stable key (user, API key, or IP) so gateway instances share limits; use atomic scripts/operations to avoid races.","Return HTTP 429 with Retry-After when limited. Distribute rule changes through a coordinator/config service and define fail-open vs fail-closed behavior."]},
{name:"YouTube",difficulty:"Medium",nodes:[
["client","Client","client",0,2],["gw","API Gateway + Load Balancer","gateway",1,2],["video","Video Service","service",2,2],["s3","S3 Object Storage","db",4,0],["cdn","CDN","external",0,0],["cache","Video Metadata Cache","cache",2,4],["meta","Video Metadata DB","db",3,4],["monitor","Upload Monitor (Lambda)","service",4,2],["pipeline","Video Processing Pipeline","service",5,1]],
edges:[["client","gw","upload / playback"],["gw","video","POST presigned URL / GET video"],["video","s3","direct chunk upload"],["client","s3","upload via presigned URL"],["s3","monitor","upload event"],["monitor","meta","store chunk data"],["video","meta","store / fetch metadata"],["meta","cache","metadata cache"],["s3","cdn","cache popular segments"],["cdn","client","manifest + segments"],["s3","pipeline","S3 event notification"],["pipeline","s3","transcoded segments + manifests"],["pipeline","meta","store manifest URLs"]],
points:["Clients upload large files directly to object storage using pre-signed URLs; API servers handle authorization and metadata, not the video bytes.","An event-driven processing pipeline splits videos, transcodes multiple resolutions/bitrates, generates audio/transcripts and manifests, then marks the upload complete.","Serve manifests and video segments through a CDN for adaptive-bitrate playback. Scale processing workers independently and make jobs retryable/idempotent."]},
{name:"Top-K Trending Views",difficulty:"Hard",nodes:[
["client","Client / Browser","client",0,1],["gw","API Gateway","gateway",1,1],["topk","Top-K Service","service",2,1],["events","ViewEvent Producer","queue",0,3],["kafka","Kafka Topic: ViewEvent","queue",1,3],["flink","Flink Streaming Jobs","service",2,3],["redis","Redis Sorted Sets / Cache","cache",3,2],["store","Durable Event Store","db",3,4]],
edges:[["client","gw","GET /views/top-k"],["gw","topk","request top K"],["topk","redis","read cached ranking"],["events","kafka","publish view events"],["kafka","flink","consume events"],["flink","redis","update counts / rankings"],["flink","store","checkpoint / archive"]],
points:["The read path is API Gateway → Top-K Service → Redis. Cache the ranked result and refresh it frequently for low latency.","Kafka buffers view events; Flink aggregates counts in event time and maintains rolling Top-K rankings. Partition by content ID or a stable aggregation key, and handle hot keys deliberately.","Use event IDs or deduplication windows for retries, Flink checkpoints for recovery, and a durable sink for replay/reconciliation. Define the ranking window and tie-breaking policy."]},
{name:"Uber Ride Matching",difficulty:"Hard",nodes:[
["rider","Rider App","client",0,0],["driver","Driver App","client",0,3],["gw","API Gateway / Load Balancer","gateway",1,1],["ride","Ride Service","service",2,0],["db","Ride / Fare DB","db",3,0],["matchq","Match Queue","queue",2,2],["matching","Ride Matching Service","service",3,2],["loc","Location Service","service",2,4],["redis","Driver Geo Index (Redis)","cache",4,3],["notify","Notification Service","external",4,0]],
edges:[["rider","gw","request ride / fare"],["driver","gw","location updates"],["gw","ride","create ride"],["ride","db","persist ride and fare"],["ride","matchq","enqueue matching job"],["matchq","matching","consume request"],["matching","redis","find nearby available drivers"],["driver","loc","GPS updates"],["loc","redis","update geo index"],["matching","notify","send offer to driver"],["notify","driver","accept / decline"],["matching","ride","assign driver"]],
points:["Ride Service owns ride state, fare estimates, and idempotent ride creation. Store state transitions durably and use an outbox/event pattern to avoid losing match requests.","The matching service queries a geospatial index for nearby available drivers, applies ETA and eligibility rules, and uses a short-lived distributed lock or conditional update to prevent double assignment.","Location updates are high volume: batch/throttle updates, expire stale driver locations, and keep matching asynchronous through a queue. Notify drivers and handle accept/decline timeouts explicitly."]},
{name:"Ad Click Aggregator",difficulty:"Hard",nodes:[
["browser","Browser","client",0,1],["gw","Load Balancer / API Gateway","gateway",1,1],["placement","Ad Placement Service","service",2,0],["click","Click Processor","service",2,2],["cache","Idempotency Cache","cache",3,1],["kinesis","Kinesis / Event Stream","queue",3,3],["flink","Flink Aggregator","service",4,2],["olap","OLAP Analytics DB","db",5,1],["s3","Raw Click Data (S3)","db",5,4],["spark","Spark Reconciliation Job","service",6,4],["worker","Reconciliation Worker","external",6,2]],
edges:[["browser","gw","request ad / click"],["gw","placement","fetch ad placement"],["placement","cache","impression idempotency key"],["gw","click","click event"],["click","cache","dedupe click ID"],["click","kinesis","publish accepted event"],["kinesis","flink","stream aggregation"],["flink","olap","minute-level click counts"],["kinesis","s3","archive raw events"],["s3","spark","scheduled batch job"],["spark","worker","compare aggregates"],["worker","olap","reconcile corrections"]],
points:["Generate a stable impression/click ID and deduplicate at ingestion with a bounded TTL. Return quickly after the event is durably accepted by the stream.","Partition stream records by AdId or advertiser ID; Flink computes windowed counts into an OLAP store. Watch for hot advertisers and use a two-stage aggregation when needed.","Retain raw events in object storage for replay. A scheduled batch reconciliation job compares stream aggregates with raw data and applies auditable corrections rather than silently overwriting results."]},
{name:"Distributed Cache (Redis)",difficulty:"Hard",nodes:[
["client","Client","client",0,1],["lb","Load Balancer / Gateway","gateway",1,1],["app1","Application Server 1","service",2,0],["app2","Application Server 2","service",2,2],["local1","L1 Local Cache + SDK","cache",3,0],["local2","L1 Local Cache + SDK","cache",3,2],["a","Redis Master A","db",4,0],["b","Redis Master B","db",4,2],["replicaA","Replica A","external",5,0],["replicaB","Replica B","external",5,2]],
edges:[["client","lb","request"],["lb","app1","route"],["lb","app2","route"],["app1","local1","local lookup / hash ring"],["app2","local2","local lookup / hash ring"],["local1","a","TCP read / write"],["local2","b","TCP read / write"],["a","replicaA","async replication"],["b","replicaB","async replication"],["a","b","cluster membership / failover"]],
points:["Use a short TTL L1 cache for very hot keys, but define invalidation/versioning because local caches can be stale. Keep the cache SDK aware of shard ownership and topology changes.","Distribute keys with consistent hashing or Redis Cluster slots. Replicas improve read capacity but asynchronous replication means a recent write may not be visible immediately.","Plan for eviction, hot keys, failover, connection pooling, timeouts, and cache stampedes. Use single-flight request coalescing and jittered TTLs; never treat cache as the only durable copy of critical data."]},
{name:"Distributed Message Queue (Kafka)",difficulty:"Hard",nodes:[
["producer","Producer","client",0,1],["broker","Kafka Broker Cluster","queue",2,1],["meta","Metadata / Controller Quorum","external",2,3],["consumer","Consumer Group","service",4,1],["retry","Retry / DLQ Topic","queue",4,3],["store","Durable Sink / Database","db",5,1]],
edges:[["producer","broker","publish keyed records"],["broker","meta","leader / ISR metadata"],["broker","consumer","poll partition records"],["consumer","broker","commit offsets"],["consumer","retry","retry or dead-letter"],["consumer","store","process idempotently"],["retry","consumer","retry with backoff"]],
points:["Topics are split into partitions; each partition has one leader and replicated followers. Ordering is guaranteed within a partition, so choose a key that matches the ordering requirement.","Consumer groups assign each partition to one consumer at a time. Offset commits control replay; commit after durable processing or use transactions/idempotency to manage duplicates.","Configure replication factor, min.insync.replicas, producer acknowledgements, retention, quotas, and lag alerts. Use retry topics with backoff and a DLQ for poison messages; do not retry forever in the hot path."]},
{name:"Live Comments",difficulty:"Medium",nodes:[
["client","Commenter Client","client",0,1],["lb","L7 Load Balancer / SSE","gateway",1,1],["manage","Comment Management Service","service",2,0],["db","Comments DB (DynamoDB)","db",4,0],["dispatch","Dispatcher","service",2,2],["realtime","Realtime Messaging Service Fleet","service",3,3]],
edges:[["client","lb","HTTPS create comment"],["lb","manage","POST /create"],["manage","db","persist comment"],["manage","dispatch","new comment event"],["dispatch","realtime","HTTPS internal delivery"],["realtime","lb","SSE stream by liveVideoId"],["lb","client","server-sent events"]],
points:["Persist a new comment, then dispatch it to the realtime messaging fleet; the create request should not wait for every viewer to receive the comment.","Clients open an SSE connection keyed by liveVideoId through an L7 load balancer. The realtime fleet streams new comments to connected viewers.","Partition/broadcast by live video, batch fanout for large audiences, and apply moderation, rate limits, backpressure, and reconnect/resume support."]}
];

let maxCol=Math.max(...current.nodes.map(n=>n[3]));let nw=176,nh=66,cw=222,rh=126,m=48;let pos={},occupied={},maxRow=0;current.nodes.forEach(n=>{let col=n[3],row=n[4],key=col+":"+row;while(occupied[key]){row++;key=col+":"+row}occupied[key]=true;maxRow=Math.max(maxRow,row);pos[n[0]]={x:m+col*cw,y:m+row*rh,n,row}});let W=m*2+maxCol*cw+nw,H=m*2+maxRow*rh+nh+10;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width",Math.max(W,700));svg.setAttribute("height",H);svg.innerHTML="";
